<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rebeca &amp; Newley | Casamento</title><meta name="description" content="Junte-se a nós para celebrar o casamento de Rebeca e Newley."><meta property="og:type" content="website"><meta property="og:title" content="Rebeca &amp; Newley | Casamento"><meta property="og:description" content="Junte-se a nós para celebrar o casamento de Rebeca e Newley."><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#efe6d6"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400&family=Pinyon+Script&family=Italianno&display=swap" rel="stylesheet"><style>/* =============================================================
   NUTTI-STYLE INVITE ENGINE — folha de estilo do convite
   Todas as cores vêm de CSS vars injetadas pelo template.
   ============================================================= */

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper-2);
  color:var(--ink);
  font-family:var(--f-body),system-ui,sans-serif;
  font-weight:300;
  line-height:1.7;
  overflow-x:hidden;
}
body.locked{overflow:hidden;height:100vh}
img{max-width:100%;display:block}
a{color:inherit}

.wrap{max-width:520px;margin:0 auto;position:relative}

/* ---------- tipografia ---------- */
.script{font-family:var(--f-script),cursive;font-weight:400;line-height:1.1}
.display{font-family:var(--f-display),serif;font-weight:300}
.eyebrow{
  font-size:.62rem;letter-spacing:.42em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:400;margin:0 0 1.1rem
}
.rule{
  width:60px;height:1px;background:var(--accent);
  margin:1.6rem auto;opacity:.7;position:relative
}
.rule::before,.rule::after{
  content:'';position:absolute;top:50%;width:4px;height:4px;
  border-radius:50%;background:var(--accent);transform:translateY(-50%)
}
.rule::before{left:-10px}.rule::after{right:-10px}

/* =============================================================
   1. ENVELOPE — a cena de abertura
   ============================================================= */
#cena{
  position:fixed;inset:0;z-index:100;
  background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;overflow:hidden;
  transition:opacity .9s ease,visibility .9s
}
#cena.foi{opacity:0;visibility:hidden;pointer-events:none}

.env{
  position:relative;width:min(86vw,330px);aspect-ratio:1/1.55;
  cursor:pointer;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.6,0,.3,1),opacity .8s;
  -webkit-tap-highlight-color:transparent
}
/* etapa final: o envelope inteiro avança e dissolve */
.env.indo{transform:translateY(8%) scale(1.55);opacity:0}

/* corpo do envelope (papel) */
.env-corpo{
  position:absolute;inset:0;border-radius:4px;
  background:
    linear-gradient(145deg,var(--paper) 0%,var(--paper-2) 58%,var(--paper) 100%);
  box-shadow:
    0 28px 60px rgba(0,0,0,.34),
    0 4px 14px rgba(0,0,0,.18),
    inset 0 1px 0 var(--emboss-hi);
  overflow:hidden
}
/* textura de papel */
.env-corpo::after{
  content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,transparent 0 2px,var(--emboss-lo) 2px 3px),
    repeating-linear-gradient(90deg,transparent 0 2px,var(--emboss-lo) 2px 3px);
  background-size:3px 3px;mix-blend-mode:multiply;opacity:.08
}

/* Relevo floral gravado no papel.
   Precisa ficar ACIMA das abas (z-index 7) — senão some atrás delas.
   A ilusão de alto-relevo vem das duas sombras opostas, não da arte. */
.relevo{
  position:absolute;left:50%;width:78%;z-index:7;
  transform:translateX(-50%);pointer-events:none;
  color:var(--paper);
  filter:
    drop-shadow(-1px -1px 0 var(--emboss-hi))
    drop-shadow(-2px -2px 1px var(--emboss-hi))
    drop-shadow(1px 1.5px 0 var(--emboss-lo))
    drop-shadow(2px 3px 3px var(--emboss-lo));
  transition:opacity .5s ease
}
.relevo.topo{top:2.5%}
.relevo.base{bottom:2.5%;transform:translateX(-50%) rotate(180deg)}
/* a de cima está "impressa" na aba: sai de cena junto com ela */
.env.abrindo .relevo.topo{opacity:0;transition:opacity .25s}
.env.indo .relevo{opacity:0}
.relevo svg{
  width:100%;height:auto;
  fill:currentColor;
  stroke:var(--emboss-lo);stroke-width:.5
}

/* abas */
.aba{position:absolute;backface-visibility:hidden}
.aba-e,.aba-d,.aba-b{z-index:3}
.aba-e{
  inset:0;clip-path:polygon(0 0,50% 50%,0 100%);
  background:linear-gradient(90deg,var(--paper-2),var(--paper));
  box-shadow:inset -1px 0 2px var(--emboss-lo)
}
.aba-d{
  inset:0;clip-path:polygon(100% 0,50% 50%,100% 100%);
  background:linear-gradient(-90deg,var(--paper-2),var(--paper));
  box-shadow:inset 1px 0 2px var(--emboss-lo)
}
.aba-b{
  inset:0;clip-path:polygon(0 100%,50% 50%,100% 100%);
  background:linear-gradient(0deg,var(--paper),var(--paper-2));
  box-shadow:inset 0 -1px 2px var(--emboss-lo)
}
/* aba superior — a que abre */
.aba-t{
  top:0;left:0;right:0;height:50%;z-index:6;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  transform-origin:top center;
  transition:transform 1.05s cubic-bezier(.62,-0.1,.32,1.08);
  box-shadow:0 2px 6px var(--emboss-lo)
}
.env.abrindo .aba-t{transform:rotateX(176deg);z-index:1;box-shadow:0 -4px 14px rgba(0,0,0,.3)}

/* luz dourada que escapa de dentro */
.luz{
  position:absolute;top:0;left:50%;width:0;height:0;z-index:2;
  transform:translateX(-50%);opacity:0;
  background:radial-gradient(ellipse at top,var(--glow),transparent 70%);
  transition:width .9s ease .3s,height .9s ease .3s,opacity .9s ease .3s
}
.env.abrindo .luz{width:160%;height:66%;opacity:.9}

/* lacre de cera — fosco, borda irregular, monograma gravado */
.lacre{
  position:absolute;top:50%;left:50%;z-index:9;
  width:86px;height:86px;transform:translate(-50%,-50%);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .45s
}
.env.selo-sai .lacre{transform:translate(-50%,-50%) scale(1.55) rotate(-8deg);opacity:0}
.lacre-disco{
  position:absolute;inset:0;
  border-radius:47% 53% 50% 50%/52% 47% 53% 48%;
  background:
    radial-gradient(circle at 50% 46%,
      color-mix(in srgb,var(--seal) 88%,#000) 0%,
      var(--seal) 46%,
      color-mix(in srgb,var(--seal) 78%,#000) 86%,
      color-mix(in srgb,var(--seal) 62%,#000) 100%);
  box-shadow:
    0 5px 14px rgba(0,0,0,.42),
    inset 0 2px 3px color-mix(in srgb,var(--emboss-hi) 50%,transparent),
    inset 0 -4px 7px rgba(0,0,0,.34);
  display:grid;place-items:center;
  animation:pulsa 2.8s ease-in-out infinite
}
/* anel interno — a marca do carimbo */
.lacre-disco::before{
  content:'';position:absolute;inset:9px;
  border-radius:48% 52% 51% 49%/50% 49% 51% 50%;
  border:1px solid rgba(0,0,0,.16);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--emboss-hi) 35%,transparent)
}
@keyframes pulsa{
  0%,100%{filter:drop-shadow(0 0 0 transparent)}
  50%    {filter:drop-shadow(0 0 10px color-mix(in srgb,var(--glow) 55%,transparent))}
}
.lacre-mono{
  position:relative;z-index:2;
  font-family:var(--f-display),serif;font-size:1.45rem;letter-spacing:.03em;
  color:var(--seal-ink);
  text-shadow:0 1px 0 color-mix(in srgb,var(--emboss-hi) 45%,transparent)
}

/* tassel (variante Blush) */
.tassel{
  position:absolute;top:50%;left:50%;z-index:9;transform:translate(-50%,-10%);
  width:26px;transition:opacity .4s
}
.env.selo-sai .tassel{opacity:0}
.tassel-arg{
  width:14px;height:14px;border:2px solid var(--seal);border-radius:50%;margin:0 auto
}
.tassel-fio{
  width:26px;height:46px;margin-top:2px;
  background:repeating-linear-gradient(90deg,var(--seal) 0 1.5px,transparent 1.5px 3px);
  border-radius:0 0 5px 5px;
  transform-origin:top center;animation:balanca 3.4s ease-in-out infinite
}
@keyframes balanca{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* carta que sai de dentro */
.carta{
  position:absolute;left:7%;right:7%;top:12%;bottom:12%;z-index:4;
  background:linear-gradient(170deg,var(--paper),var(--paper-2));
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  box-shadow:0 8px 22px rgba(0,0,0,.26);
  display:grid;place-items:center;text-align:center;padding:1.4rem;
  transform:translateY(0);opacity:0;
  transition:transform 1s cubic-bezier(.33,0,.18,1),opacity .35s
}
.env.carta-sai .carta{transform:translateY(-54%);opacity:1}
.carta .script{font-size:2rem;color:var(--ink)}
.carta .eyebrow{font-size:.55rem;margin-bottom:.6rem}

/* variante PEEL — "puxe aqui" */
.env.peel .aba-t,.env.peel .aba-e,.env.peel .aba-d,.env.peel .aba-b{display:none}
.env.peel .capa{
  position:absolute;inset:0;z-index:6;border-radius:4px;overflow:hidden;
  background:linear-gradient(160deg,var(--paper),var(--paper-2));
  transform-origin:bottom right;
  transition:transform 1.1s cubic-bezier(.65,0,.35,1),opacity .9s
}
.env.peel.abrindo .capa{transform:rotate(-16deg) translate(-120%,20%);opacity:0}
/* no peel a carta não sobe: ela é revelada pela capa saindo */
.env.peel .carta{
  inset:6%;transform:none;opacity:0;
  transition:opacity .7s ease .45s
}
.env.peel.abrindo .carta{opacity:1;transform:none}
.env.peel.carta-sai .carta{transform:none}

.env.peel .dobra{
  position:absolute;right:0;bottom:0;width:72px;height:72px;z-index:7;
  background:linear-gradient(135deg,transparent 50%,var(--paper) 50%);
  filter:drop-shadow(-3px -3px 6px rgba(0,0,0,.25));
  animation:acena 2.8s ease-in-out infinite
}
@keyframes acena{0%,100%{width:72px;height:72px}50%{width:88px;height:88px}}
.env.peel.abrindo .dobra{opacity:0;transition:opacity .4s}

.puxe{
  position:absolute;right:10px;bottom:26px;z-index:8;
  font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-soft);transform:rotate(-45deg);white-space:nowrap
}
.env.abrindo .puxe{opacity:0;transition:opacity .3s}

/* instrução */
.toque{
  position:absolute;bottom:7vh;left:0;right:0;text-align:center;z-index:101;
  font-size:.58rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink-soft);animation:respira 2.4s ease-in-out infinite;
  pointer-events:none
}
@keyframes respira{0%,100%{opacity:.4}50%{opacity:1}}
#cena.foi .toque{opacity:0}

/* =============================================================
   2. CAPA do convite
   ============================================================= */
.capa-hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:4rem 1.8rem;position:relative;
  background:
    radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent-2) 30%,transparent),transparent 60%),
    linear-gradient(180deg,var(--paper),var(--paper-2))
}
.capa-hero .moldura{
  position:absolute;inset:16px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  pointer-events:none
}
.capa-hero .moldura::before,.capa-hero .moldura::after{
  content:'';position:absolute;width:14px;height:14px;border:1px solid var(--accent)
}
.capa-hero .moldura::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.capa-hero .moldura::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

.mono-grande{
  font-family:var(--f-display),serif;font-size:3.4rem;letter-spacing:.06em;
  color:var(--accent);line-height:1;margin:0 0 1.6rem
}
.nomes{font-size:clamp(2.6rem,13vw,4.2rem);color:var(--ink);margin:.2rem 0}
.e-comercial{
  display:block;font-size:1.5rem;color:var(--accent);
  margin:-.2rem 0;font-family:var(--f-script),cursive
}
.data-capa{
  font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:1.8rem
}
.seta{
  position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);
  width:1px;height:38px;background:linear-gradient(var(--accent),transparent);
  animation:desce 2s ease-in-out infinite
}
@keyframes desce{0%,100%{opacity:.2;height:24px}50%{opacity:1;height:44px}}

/* =============================================================
   3. SEÇÕES
   ============================================================= */
section{padding:5rem 1.8rem;text-align:center;position:relative}
section.alt{background:var(--paper-2)}
section:not(.alt){background:var(--paper)}
.sec-titulo{
  font-size:2.3rem;color:var(--ink);margin:0 0 .4rem;
  font-family:var(--f-script),cursive
}
/* datas por extenso são longas demais para a cursiva */
.sec-titulo.data{
  font-family:var(--f-display),serif;font-size:1.45rem;
  letter-spacing:.03em;line-height:1.4
}
.sec-texto{
  font-size:.92rem;color:var(--ink-soft);max-width:34ch;margin:0 auto;
  line-height:1.95
}

/* reveal no scroll */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;transform:none}

/* contagem regressiva */
.contagem{display:flex;justify-content:center;gap:.5rem;margin-top:2rem}
.cx{
  flex:1;max-width:82px;padding:.9rem .3rem;
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  background:color-mix(in srgb,var(--accent-2) 16%,transparent)
}
.cx b{
  display:block;font-family:var(--f-display),serif;font-size:1.9rem;
  font-weight:400;color:var(--ink);line-height:1
}
.cx span{
  font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft)
}

/* cards de evento */
.evento{
  border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
  padding:2.2rem 1.4rem;margin:1.2rem auto 0;max-width:340px;
  background:color-mix(in srgb,var(--paper) 60%,transparent)
}
.evento h3{
  font-family:var(--f-script),cursive;font-weight:400;
  font-size:1.7rem;margin:.6rem 0 .3rem;color:var(--ink)
}
.evento .hora{
  font-family:var(--f-display),serif;font-size:2.1rem;color:var(--accent);
  margin:.2rem 0
}
.evento p{margin:.2rem 0;font-size:.85rem;color:var(--ink-soft)}
.icone{font-size:1.3rem;color:var(--accent);opacity:.8}

/* botões */
.btn{
  display:inline-block;margin-top:1.4rem;padding:.92rem 2.1rem;
  font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;
  text-decoration:none;border:1px solid var(--accent);color:var(--accent);
  background:transparent;cursor:pointer;font-family:inherit;
  transition:background .35s,color .35s
}
.btn:hover,.btn:active{background:var(--accent);color:var(--paper)}
.btn.cheio{background:var(--accent);color:var(--paper)}
.btn.cheio:hover{filter:brightness(1.12)}
.btn-linha{
  display:block;margin:.7rem auto 0;max-width:300px
}

/* galeria */
.galeria{
  display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;
  margin-top:2rem
}
.galeria img{
  width:100%;aspect-ratio:3/4;object-fit:cover;
  filter:saturate(.9) contrast(1.02)
}
.galeria img:first-child:nth-last-child(odd){grid-column:span 2;aspect-ratio:4/3}

/* foto destaque */
.foto-destaque{
  width:100%;max-width:340px;margin:0 auto 2rem;aspect-ratio:4/5;
  object-fit:cover;
  box-shadow:0 18px 40px rgba(0,0,0,.2)
}
.foto-destaque.oval{border-radius:50% 50% 50% 50%/42% 42% 58% 58%}

/* padrinhos / detalhes em lista */
.lista-simples{list-style:none;padding:0;margin:1.6rem 0 0}
.lista-simples li{
  font-size:.9rem;color:var(--ink-soft);padding:.45rem 0;
  border-bottom:1px solid color-mix(in srgb,var(--accent) 18%,transparent)
}
.lista-simples li:last-child{border:0}

/* pix */
.pix-box{
  margin:1.4rem auto 0;max-width:330px;padding:1.2rem;
  border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);
  font-size:.78rem;color:var(--ink-soft);word-break:break-all
}
.pix-box code{
  display:block;margin-top:.5rem;font-size:.84rem;color:var(--ink);
  letter-spacing:.02em
}

/* rodapé */
footer{
  padding:4rem 1.8rem 3rem;text-align:center;background:var(--paper-2);
  border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)
}
footer .script{font-size:1.9rem;color:var(--accent)}
.assinatura{
  margin-top:2.4rem;font-size:.5rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink-soft);opacity:.55
}
.assinatura a{text-decoration:none}

/* botão de música */
.som{
  position:fixed;right:14px;bottom:14px;z-index:60;
  width:42px;height:42px;border-radius:50%;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);
  background:color-mix(in srgb,var(--paper) 85%,transparent);
  backdrop-filter:blur(8px);
  display:grid;place-items:center;color:var(--accent);font-size:.9rem;
  opacity:0;transform:scale(.6);transition:opacity .5s,transform .5s
}
.som.vis{opacity:1;transform:none}
.som.off{color:var(--ink-soft);opacity:.55}

/* pétalas */
#petalas{
  position:fixed;inset:0;pointer-events:none;z-index:50;
  opacity:0;transition:opacity 1.4s
}
#petalas.on{opacity:1}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.18s!important}
  .rv{opacity:1;transform:none}
}

/* ícones de traço */
.ico{
  width:26px;height:26px;display:block;margin:0 auto .6rem;
  color:var(--accent);opacity:.85;stroke-width:1.1
}
.evento .ico{margin-bottom:.2rem}

    abriu = true;

    // o clique É o gesto do usuário — é aqui, e só aqui, que o autoplay é liberado
    if (audio) {
      audio.volume = 0;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
      var vol = setInterval(function () {
        if (audio.volume < 0.34) audio.volume = Math.min(0.34, audio.volume + 0.02);
        else clearInterval(vol);
      }, 120);
      if (btnSom) btnSom.classList.add('vis');
    }

    var passos = [
      [0,    'selo-sai'],   // o lacre se rompe
      [420,  'abrindo'],    // a aba gira e a luz escapa
      [1220, 'carta-sai'],  // a carta sobe de dentro
      [2250, 'indo']        // tudo avança e dissolve
    ];
    passos.forEach(function (p) {
      setTimeout(function () { env.classList.add(p[1]); }, p[0]);
    });

    setTimeout(function () {
      cenaEl.classList.add('foi');
      document.body.classList.remove('locked');
      window.scrollTo(0, 0);
      var pet = document.getElementById('petalas');
      if (pet) pet.classList.add('on');
    }, 2750);
  }

  env.addEventListener('click', abrir);
  env.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); }
  });

  if (btnSom && audio) {
    btnSom.addEventListener('click', function () {
      if (audio.paused) { audio.play(); btnSom.classList.remove('off'); btnSom.textContent = '♪'; }
      else { audio.pause(); btnSom.classList.add('off'); btnSom.textContent = '✕'; }
    });
  }

  /* reveal no scroll */
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.rv').forEach(function (el) { io.observe(el); });

  /* contagem regressiva */
  if (dt) {
    var alvo = dt.getTime();
    var campos = {};
    document.querySelectorAll('#contagem [data-c]').forEach(function (el) { campos[el.dataset.c] = el; });
    (function tick() {
      var dif = Math.max(0, alvo - Date.now());
      var seg = Math.floor(dif / 1000);
      var o = {
        d: Math.floor(seg / 86400),
        h: Math.floor(seg % 86400 / 3600),
        m: Math.floor(seg % 3600 / 60),
        s: seg % 60
      };
      Object.keys(campos).forEach(function (k) {
        campos[k].textContent = String(o[k]).padStart(2, '0');
      });
      setTimeout(tick, 1000);
    })();
  }

  /* copiar PIX */
  var bp = document.getElementById('copiaPix');
  if (bp) {
    bp.addEventListener('click', function () {
      var txt = document.getElementById('pix').textContent;
      var ok = function () { bp.textContent = 'Copiado ✓'; setTimeout(function () { bp.textContent = 'Copiar chave PIX'; }, 2200); };
      if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(ok, ok); }
      else {
        var t = document.createElement('textarea');
        t.value = txt; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(t); ok();
      }
    });
  }

  /* pétalas flutuantes */
  (function () {
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    var cv = document.getElementById('petalas');
    if (!cv) return;
    var cx = cv.getContext('2d'), w, h, ps = [];
    var cor = getComputedStyle(root).getPropertyValue('--accent-2').trim() || '#e3cfa4';
    function dim() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
    dim(); addEventListener('resize', dim);
    for (var i = 0; i < 16; i++) {
      ps.push({
        x: Math.random() * w, y: Math.random() * h,
        r: 3 + Math.random() * 5, vy: .22 + Math.random() * .5,
        vx: -.25 + Math.random() * .5, a: Math.random() * 6.28,
        va: -.015 + Math.random() * .03, o: .18 + Math.random() * .3
      });
    }
    (function loop() {
      cx.clearRect(0, 0, w, h);
      ps.forEach(function (p) {
        p.y += p.vy; p.x += p.vx + Math.sin(p.y / 80) * .3; p.a += p.va;
        if (p.y > h + 20) { p.y = -20; p.x = Math.random() * w; }
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
        cx.globalAlpha = p.o; cx.fillStyle = cor;
        cx.beginPath(); cx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.2832); cx.fill();
        cx.restore();
      });
      requestAnimationFrame(loop);
    })();
  })();
})();
</script></body></html>

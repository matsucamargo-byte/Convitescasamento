<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rebeca &amp; Newley | Casamento</title><meta name="description" content="Junte-se a nós para celebrar o casamento de Rebeca e Newley."><meta property="og:type" content="website"><meta property="og:title" content="Rebeca &amp; Newley | Casamento"><meta property="og:description" content="Junte-se a nós para celebrar o casamento de Rebeca e Newley."><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#b59a83"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora&family=Karla:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet"><style>/* =============================================================
   Folha de estilo do convite.
   Cores e fontes vêm de CSS vars injetadas pelo template.
   ============================================================= */

:root{
  /* curvas canônicas — não inventar cubic-bezier */
  --ease-out   : cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

body{
  background:var(--paper-2);
  color:var(--ink);
  font-family:var(--f-body),system-ui,sans-serif;
  font-weight:300;
  line-height:1.75;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden;height:100svh}
img{max-width:100%;display:block}
a{color:inherit}

/* -------------------------------------------------------------
   Superfícies do navegador. São as partes que a gente não desenha
   mas que entregam se a página foi montada ou construída.
   ------------------------------------------------------------- */
::selection{background:var(--accent);color:var(--paper)}
:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
  border-radius:2px
}
:focus:not(:focus-visible){outline:none}
* { scrollbar-width:thin; scrollbar-color:var(--accent-2) transparent }
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--accent-2);border-radius:4px;
  border:2px solid transparent;background-clip:content-box
}

.wrap{max-width:560px;margin:0 auto;position:relative}

/* ---------- tipografia ---------- */
.script{font-family:var(--f-script),cursive;font-weight:400;line-height:1.14}
.display{font-family:var(--f-display),serif;font-weight:400}

.rule{
  width:54px;height:1px;background:var(--accent);
  margin:1.5rem auto;opacity:.6;position:relative
}
.rule::before,.rule::after{
  content:'';position:absolute;top:50%;width:3px;height:3px;
  border-radius:50%;background:var(--accent);transform:translateY(-50%)
}
.rule::before{left:-9px}.rule::after{right:-9px}

/* =============================================================
   1. ENVELOPE — o único momento autoral de movimento da página
   ============================================================= */
#cena{
  position:fixed;inset:0;z-index:100;
  background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;
  perspective:1500px;overflow:hidden;
  transition:opacity .9s var(--ease-out),visibility .9s
}
#cena.foi{opacity:0;visibility:hidden;pointer-events:none}

/* A largura é limitada TAMBÉM pela altura: com proporção 1/1.55,
   largura W gera altura 1.55W. Para caber em 78% da tela, W <= 50svh.
   Sem isso o envelope estoura em paisagem. */
.env{
  position:relative;width:min(86vw,330px,50svh);aspect-ratio:1/1.55;
  cursor:pointer;transform-style:preserve-3d;
  transition:transform 1s var(--ease-in-out),opacity .8s var(--ease-out);
  -webkit-tap-highlight-color:transparent
}
.env.indo{transform:translateY(8%) scale(1.5);opacity:0}

.env-corpo{
  position:absolute;inset:0;border-radius:3px;
  background:linear-gradient(148deg,var(--paper) 0%,var(--paper-2) 56%,var(--paper) 100%);
  box-shadow:
    0 26px 54px -12px var(--sombra),
    0 6px 16px -6px var(--sombra),
    inset 0 1px 0 var(--emboss-hi);
  overflow:hidden
}
/* grão do papel — ruído fractal, não listras repetidas */
.env-corpo::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  opacity:.16;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22160%22%20height%3D%22160%22%3E%3Cfilter%20id%3D%22g%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.82%22%20numOctaves%3D%224%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22160%22%20height%3D%22160%22%20filter%3D%22url%28%23g%29%22%2F%3E%3C%2Fsvg%3E");
  background-size:160px 160px
}

/* Relevo gravado. Fica ACIMA das abas (z-index 7) — abaixo delas some.
   A ilusão de alto-relevo vem das sombras opostas, não do desenho. */
.relevo{
  position:absolute;left:50%;width:74%;z-index:7;
  transform:translateX(-50%);pointer-events:none;
  color:var(--paper);
  filter:
    drop-shadow(-1px -1px 0 var(--emboss-hi))
    drop-shadow(-2px -2px 1px var(--emboss-hi))
    drop-shadow(1px 1.5px 0 var(--emboss-lo))
    drop-shadow(2px 3px 3px var(--emboss-lo));
  transition:opacity .4s var(--ease-out)
}
.relevo.topo{top:3%}
.relevo.base{bottom:3%;transform:translateX(-50%) rotate(180deg)}
.env.abrindo .relevo.topo{opacity:0;transition-duration:.25s}
.env.indo .relevo{opacity:0}
.relevo svg{width:100%;height:auto}
/* ornamento comprado entra como imagem no lugar do vetor */
.relevo img{width:100%;height:auto;opacity:.92}

/* abas */
.aba{position:absolute;inset:0;backface-visibility:hidden;z-index:3}
.aba-e{
  clip-path:polygon(0 0,50% 50%,0 100%);
  background:linear-gradient(90deg,var(--paper-2),var(--paper))
}
.aba-d{
  clip-path:polygon(100% 0,50% 50%,100% 100%);
  background:linear-gradient(-90deg,var(--paper-2),var(--paper))
}
.aba-b{
  clip-path:polygon(0 100%,50% 50%,100% 100%);
  background:linear-gradient(0deg,var(--paper),var(--paper-2))
}
.aba-t{
  inset:0 0 auto 0;height:50%;z-index:6;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  transform-origin:top center;
  transition:transform 1.05s var(--ease-in-out);
  box-shadow:0 2px 6px -2px var(--sombra)
}
.env.abrindo .aba-t{transform:rotateX(176deg);z-index:1}

/* Luz que escapa de dentro. Escala, não width/height —
   animar dimensão dispara layout a cada frame. */
.luz{
  position:absolute;top:0;left:50%;z-index:2;
  width:160%;height:66%;
  transform:translateX(-50%) scaleY(0);transform-origin:top center;
  opacity:0;
  background:radial-gradient(ellipse at top,var(--glow),transparent 70%);
  transition:transform .9s var(--ease-out) .25s,opacity .8s var(--ease-out) .25s
}
.env.abrindo .luz{transform:translateX(-50%) scaleY(1);opacity:.9}

/* lacre de cera: fosco, borda irregular, monograma gravado */
.lacre{
  position:absolute;top:50%;left:50%;z-index:9;
  width:84px;height:84px;transform:translate(-50%,-50%);
  transition:transform .5s var(--ease-out),opacity .45s var(--ease-out)
}
.env.selo-sai .lacre{transform:translate(-50%,-50%) scale(1.5) rotate(-7deg);opacity:0}
.lacre-disco{
  position:absolute;inset:0;
  border-radius:47% 53% 50% 50%/52% 47% 53% 48%;
  background:radial-gradient(circle at 50% 46%,
    color-mix(in srgb,var(--seal) 88%,#000) 0%,
    var(--seal) 46%,
    color-mix(in srgb,var(--seal) 78%,#000) 86%,
    color-mix(in srgb,var(--seal) 60%,#000) 100%);
  box-shadow:
    0 5px 13px -3px var(--sombra),
    inset 0 2px 3px color-mix(in srgb,var(--emboss-hi) 50%,transparent),
    inset 0 -4px 7px rgba(0,0,0,.32);
  display:grid;place-items:center
}
.lacre-disco::before{
  content:'';position:absolute;inset:8px;
  border-radius:48% 52% 51% 49%/50% 49% 51% 50%;
  border:1px solid rgba(0,0,0,.15);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--emboss-hi) 32%,transparent)
}
.lacre-mono{
  position:relative;z-index:2;
  font-family:var(--f-display),serif;font-size:1.4rem;letter-spacing:.02em;
  color:var(--seal-ink);
  text-shadow:0 1px 0 color-mix(in srgb,var(--emboss-hi) 40%,transparent)
}

/* carta que sai de dentro */
.carta{
  position:absolute;left:7%;right:7%;top:12%;bottom:12%;z-index:4;
  background:linear-gradient(168deg,var(--paper),var(--paper-2));
  border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
  box-shadow:0 8px 20px -8px var(--sombra);
  display:grid;place-items:center;text-align:center;padding:1.3rem;
  opacity:0;
  transition:transform 1s var(--ease-out),opacity .35s var(--ease-out)
}
.env.carta-sai .carta{transform:translateY(-52%);opacity:1}
.carta .script{font-size:1.85rem;color:var(--ink)}
.carta .sub{
  font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 .7rem
}

/* variante PEEL — puxar a ponta */
.env.peel .aba{display:none}
.env.peel .capa{
  position:absolute;inset:0;z-index:6;border-radius:3px;overflow:hidden;
  background:linear-gradient(158deg,var(--paper),var(--paper-2));
  transform-origin:bottom right;
  transition:transform 1.1s var(--ease-in-out),opacity .9s var(--ease-out)
}
.env.peel.abrindo .capa{transform:rotate(-15deg) translate(-118%,18%);opacity:0}
.env.peel .carta{
  inset:6%;opacity:0;
  transition:opacity .7s var(--ease-out) .4s
}
.env.peel.abrindo .carta{opacity:1}
.env.peel.carta-sai .carta{transform:none}
.env.peel .dobra{
  position:absolute;right:0;bottom:0;width:78px;height:78px;z-index:7;
  background:linear-gradient(135deg,transparent 50%,var(--paper) 50%);
  filter:drop-shadow(-3px -3px 6px var(--sombra));
  transform-origin:bottom right;
  animation:acena 2.8s var(--ease-in-out) infinite
}
/* escala, não width/height */
@keyframes acena{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.env.peel.abrindo .dobra{opacity:0;transition:opacity .35s var(--ease-out)}
.puxe{
  position:absolute;right:8px;bottom:26px;z-index:8;
  font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink-soft);transform:rotate(-45deg);white-space:nowrap
}
.env.abrindo .puxe{opacity:0;transition:opacity .3s var(--ease-out)}

.toque{
  position:absolute;left:0;right:0;z-index:101;text-align:center;
  bottom:max(6vh,calc(env(safe-area-inset-bottom) + 1.6rem));
  font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-soft);pointer-events:none;
  animation:respira 2.6s var(--ease-in-out) infinite
}
@keyframes respira{0%,100%{opacity:.45}50%{opacity:1}}
#cena.foi .toque{opacity:0}

/* =============================================================
   2. CAPA
   ============================================================= */
.capa-hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:5rem 1.9rem;position:relative;
  background:
    radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent-2) 26%,transparent),transparent 62%),
    linear-gradient(180deg,var(--paper),var(--paper-2))
}
.moldura{
  position:absolute;inset:15px;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)
}
.moldura::before,.moldura::after{
  content:'';position:absolute;width:13px;height:13px;border:1px solid var(--accent)
}
.moldura::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.moldura::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

.mono-grande{
  font-family:var(--f-display),serif;font-size:2.9rem;letter-spacing:.05em;
  color:var(--accent);line-height:1;margin:0 0 1.5rem;font-weight:400
}
.nomes{
  font-size:clamp(2.7rem,13.5vw,4.3rem);color:var(--ink);
  margin:.1rem 0;letter-spacing:-.01em
}
.e-comercial{
  display:block;font-size:1.4rem;color:var(--accent);margin:-.15rem 0
}
.versiculo{
  font-size:.82rem;color:var(--ink-soft);max-width:30ch;margin:0 auto 1.4rem;
  font-style:italic;line-height:1.7
}
.data-capa{
  font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:1.7rem;font-variant-numeric:tabular-nums
}
.seta{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:max(2rem,calc(env(safe-area-inset-bottom) + .8rem));
  width:1px;height:36px;background:linear-gradient(var(--accent),transparent);
  transform-origin:top center;
  animation:desce 2.2s var(--ease-in-out) infinite
}
@keyframes desce{
  0%,100%{opacity:.25;transform:translateX(-50%) scaleY(.6)}
  50%    {opacity:1;transform:translateX(-50%) scaleY(1)}
}

/* =============================================================
   3. SEÇÕES
   ============================================================= */
section{padding:5.5rem 1.9rem;position:relative}
section.centro{text-align:center}
.faixa-clara{background:var(--paper)}
.faixa-escura{background:var(--paper-2)}
/* seção invertida: o contraste mais forte da página fica na única ação */
.faixa-invertida{
  background:var(--ink);color:var(--paper);text-align:center
}
.faixa-invertida .sec-titulo{color:var(--paper)}
.faixa-invertida .sec-texto{color:color-mix(in srgb,var(--paper) 74%,var(--ink))}
.faixa-invertida .rule{background:var(--accent-2);opacity:.8}
.faixa-invertida .rule::before,.faixa-invertida .rule::after{background:var(--accent-2)}

.sec-titulo{
  font-family:var(--f-script),cursive;font-weight:400;
  font-size:clamp(2rem,8.5vw,2.6rem);color:var(--ink);
  margin:0 0 .3rem;line-height:1.18
}
/* datas por extenso são longas demais para a cursiva */
.sec-titulo.data{
  font-family:var(--f-display),serif;
  font-size:clamp(1.3rem,5.6vw,1.6rem);
  letter-spacing:.02em;line-height:1.45
}
.sec-texto{
  font-size:.95rem;color:var(--ink-soft);max-width:46ch;
  line-height:1.95;margin:0 auto .9rem
}
.sec-texto:last-child{margin-bottom:0}

/* Revelação só onde a sequência significa algo (linha do tempo, galeria).
   Entrada idêntica em toda seção é ruído, não design.
   Parte do estado visível: sem JS a página continua legível. */
@media (prefers-reduced-motion:no-preference){
  .seq > *{opacity:0;transform:translateY(14px)}
  .seq.on > *{
    opacity:1;transform:none;
    transition:opacity .7s var(--ease-out),transform .7s var(--ease-out);
    transition-delay:calc(var(--i,0) * 90ms)
  }
}

/* ---- contagem: faixa com a data em display e números tabulares ---- */
.contagem{
  display:grid;grid-template-columns:repeat(4,1fr);
  max-width:360px;margin:2rem auto 0;
  border-top:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent)
}
.cx{padding:1rem .2rem;text-align:center;position:relative}
.cx + .cx::before{
  content:'';position:absolute;left:0;top:22%;bottom:22%;width:1px;
  background:color-mix(in srgb,var(--accent) 22%,transparent)
}
.cx b{
  display:block;font-family:var(--f-display),serif;font-size:1.85rem;
  font-weight:400;color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.01em
}
.cx span{
  display:block;margin-top:.3rem;
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft)
}

/* ---- história: foto sangra na borda, texto deslocado ---- */
.historia{display:grid;gap:2rem}
.historia .foto{
  width:calc(100% + 1.9rem);margin-left:-1.9rem;
  aspect-ratio:4/5;object-fit:cover;
  box-shadow:0 20px 44px -18px var(--sombra)
}
.historia .texto{padding-right:.5rem}
.historia .sec-texto{margin-left:0;max-width:40ch}

/* ---- eventos: linha do tempo numa régua, sem cards ---- */
.linha{
  margin:2.4rem 0 0;padding:0;list-style:none;
  border-left:1px solid color-mix(in srgb,var(--accent) 34%,transparent)
}
.linha li{position:relative;padding:0 0 2.6rem 1.6rem}
.linha li:last-child{padding-bottom:0}
.linha li::before{
  content:'';position:absolute;left:-4.5px;top:.55rem;
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--paper)
}
.faixa-escura .linha li::before{box-shadow:0 0 0 4px var(--paper-2)}
.linha .hora{
  font-family:var(--f-display),serif;font-size:1.7rem;color:var(--accent);
  line-height:1;font-variant-numeric:tabular-nums
}
.linha h3{
  font-family:var(--f-script),cursive;font-weight:400;font-size:1.5rem;
  margin:.3rem 0 .4rem;color:var(--ink)
}
.linha p{margin:.1rem 0;font-size:.9rem;color:var(--ink-soft);line-height:1.7}
.linha .btn{margin-top:.9rem}

/* ---- traje: uma linha, tipografia grande, nada mais ---- */
.traje{text-align:center}
.traje .valor{
  font-family:var(--f-display),serif;
  font-size:clamp(1.7rem,7.5vw,2.2rem);
  color:var(--ink);margin:0;letter-spacing:.01em
}

/* ---- botões ---- */
.btn{
  display:inline-block;padding:.95rem 2rem;
  font-family:inherit;font-size:.7rem;letter-spacing:.24em;
  text-transform:uppercase;text-decoration:none;cursor:pointer;
  border:1px solid var(--accent);color:var(--accent);background:transparent;
  transition:background .25s var(--ease-out),color .25s var(--ease-out),
             transform .12s var(--ease-out)
}
.btn:active{transform:translateY(1px)}
.btn.cheio{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.faixa-invertida .btn.cheio{
  background:var(--accent-2);color:var(--ink);border-color:var(--accent-2)
}
.btn-bloco{display:block;max-width:300px;margin:1.2rem auto 0;text-align:center}
/* toque dispara hover falso — só em ponteiro fino */
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--accent);color:var(--paper)}
  .btn.cheio:hover{filter:brightness(1.1)}
  .faixa-invertida .btn.cheio:hover{background:var(--accent-2);filter:brightness(1.08)}
}

/* ---- galeria assimétrica ---- */
.galeria{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:2rem}
.galeria img{width:100%;height:100%;object-fit:cover;aspect-ratio:3/4}
.galeria img:nth-child(3n+1){grid-column:span 2;aspect-ratio:16/10}

/* ---- pix ---- */
.pix{
  margin:1.5rem auto 0;max-width:330px;padding:1.1rem 1.2rem;
  border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
  text-align:center
}
.pix .rotulo{
  font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-soft)
}
.pix code{
  display:block;margin:.5rem 0 .9rem;font-family:var(--f-body),monospace;
  font-size:.88rem;color:var(--ink);word-break:break-all;letter-spacing:.01em
}

/* ---- rodapé ---- */
footer{
  text-align:center;background:var(--paper-2);
  padding:4.5rem 1.9rem max(3rem,calc(env(safe-area-inset-bottom) + 2rem));
  border-top:1px solid color-mix(in srgb,var(--accent) 22%,transparent)
}
footer .nomes-fim{
  font-family:var(--f-script),cursive;font-size:2rem;color:var(--accent);
  margin:.6rem 0 0;line-height:1.2
}
/* Sem caixa alta: data por extenso mais cidade passa de 40 caracteres,
   e caixa alta nesse comprimento para de ser legível. */
footer .data-fim{
  font-family:var(--f-display),serif;font-size:.92rem;letter-spacing:.04em;
  color:var(--ink-soft);margin-top:1.1rem;font-variant-numeric:tabular-nums
}
footer .cidade-fim{
  font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:.35rem;opacity:.8
}
.assinatura{
  margin-top:2.6rem;font-size:.7rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-soft);opacity:.6
}
.assinatura a{text-decoration:none}

/* ---- ícones: traço único e peso único em todos ---- */
.ico{
  width:24px;height:24px;display:block;margin:0 0 .5rem;
  color:var(--accent);stroke-width:1.25;fill:none;
  stroke:currentColor;stroke-linecap:round;stroke-linejoin:round
}
.centro .ico{margin-inline:auto}

/* ---- som ---- */
.som{
  position:fixed;z-index:60;
  right:max(14px,env(safe-area-inset-right));
  bottom:max(14px,calc(env(safe-area-inset-bottom) + 6px));
  width:44px;height:44px;border-radius:50%;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:grid;place-items:center;color:var(--accent);
  opacity:0;transform:scale(.7);
  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)
}
.som.vis{opacity:1;transform:none}
.som.off{color:var(--ink-soft);opacity:.55}
.som svg{width:17px;height:17px;stroke-width:1.4;fill:none;stroke:currentColor}

#petalas{
  position:fixed;inset:0;pointer-events:none;z-index:50;
  opacity:0;transition:opacity 1.4s var(--ease-out)
}
#petalas.on{opacity:1}

/* =============================================================
   Telas muito baixas em paisagem
   ============================================================= */
@media (orientation:landscape) and (max-height:500px){
  .capa-hero{min-height:auto;padding:3.5rem 1.9rem}
  section{padding:3.5rem 1.9rem}
  .mono-grande{font-size:2.1rem;margin-bottom:.9rem}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .seta,.toque,.dobra{animation:none}
  .seq > *{opacity:1;transform:none}
  /* o envelope ainda abre, só que sem os percursos longos */
  .env,.aba-t,.carta,.lacre,.capa{transition-duration:.25s!important}
  .luz{transition-duration:.25s!important}
}

/* Ornamento 'foil': traço na cor de destaque, como hot stamping.
   Sem as sombras opostas do relevo — em linha fina elas viram risco duplo. */
.relevo.foil{
  color:var(--accent);
  filter:drop-shadow(0 1px 1px var(--emboss-lo));
  opacity:.9
}
.relevo svg{fill:currentColor}
/* Caules já trazem stroke inline e ficam na cor do papel. */
.relevo:not(.foil) svg [stroke]{stroke:currentColor}
/* Pétalas e folhas ganham um fio de sombra no contorno. Sem isso as
   camadas se fundem numa massa só: o relevo cego contorna apenas a
   silhueta externa e a estrutura interna some. */
.relevo:not(.foil) svg path:not([stroke]),
.relevo:not(.foil) svg ellipse:not([stroke]),
.relevo:not(.foil) svg circle:not([stroke]){
  stroke:var(--emboss-lo);
  stroke-width:.7;
  vector-effect:non-scaling-stroke;
  paint-order:fill stroke
}

/* =============================================================
   CAMADAS DE MÍDIA
   O que separa um convite caro de um barato não é o CSS: é haver
   imagem e vídeo de verdade no lugar de tipografia sobre cor chapada.
   Os concorrentes premium carregam de 4 a 24 arquivos de mídia por
   convite. Estas camadas existem para receber esses arquivos.
   ============================================================= */
.midia{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--paper-2)}
.midia img,.midia video{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.04)            /* evita borda branca no parallax leve */
}
/* véu: sem ele a tipografia some sobre foto clara */
.veu{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--paper-2) calc(var(--veu,55) * 1%),transparent) 0%,
      color-mix(in srgb,var(--paper-2) calc(var(--veu,55) * .62%),transparent) 42%,
      color-mix(in srgb,var(--paper-2) calc(var(--veu,55) * 1.25%),transparent) 100%)
}
/* tudo que não é mídia sobe acima do véu */
.com-midia > *:not(.midia):not(.veu){position:relative;z-index:2}

/* textura de fundo da página inteira — aquarela, linho, papel */
body.tem-textura{
  background-image:var(--textura);
  background-size:cover;background-attachment:fixed;background-position:center
}
body.tem-textura .faixa-clara{
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)
}
body.tem-textura .faixa-escura{
  background:color-mix(in srgb,var(--paper-2) 88%,transparent);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)
}

/* sobre foto, a tipografia precisa de mais ar e de sombra */
.com-midia .nomes,
.com-midia .mono-grande{text-shadow:0 2px 24px color-mix(in srgb,var(--paper-2) 70%,transparent)}
.com-midia .moldura{border-color:color-mix(in srgb,var(--ink) 26%,transparent)}

/* =============================================================
   CORTINA EM VÍDEO — a abertura dos concorrentes premium
   ============================================================= */
#cena.cortina{background:#000;perspective:none}
.cortina-midia{position:absolute;inset:0;z-index:1}
.cortina-midia video{width:100%;height:100%;object-fit:cover;display:block}
.cortina-toque{
  position:absolute;inset:0;z-index:3;display:grid;place-items:end center;
  padding-bottom:max(8vh,calc(env(safe-area-inset-bottom) + 2rem));
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45) 100%)
}
.cortina-toque p{
  margin:0;color:#fff;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
  animation:respira 2.6s var(--ease-in-out) infinite
}
#cena.cortina.tocou .cortina-toque{opacity:0;transition:opacity .5s var(--ease-out);pointer-events:none}


/* =============================================================
   ACABAMENTO
   Os detalhes que separam papelaria de texto de site.
   ============================================================= */

/* Recursos OpenType das serifadas: ligaduras e kerning de verdade. */
.nomes,.sec-titulo,.mono-grande,.carta .script,.linha h3,
.traje .valor,.data-capa,.data-fim,.pais-nome{
  font-feature-settings:"kern" 1,"liga" 1,"clig" 1,"calt" 1;
  font-kerning:normal
}
/* Algarismos antigos nas datas: numeral que sobe e desce acompanha a
   serifada. Na contagem não, que ali precisa de largura fixa. */
.data-capa,.data-fim,.sec-titulo.data{font-variant-numeric:oldstyle-nums}
.cx b{font-variant-numeric:tabular-nums lining-nums}

/* Quebra equilibrada: evita a última linha com uma palavra só. */
.sec-titulo,.nomes,.traje .valor,.carta .script,.linha h3{
  text-wrap:balance;
  -webkit-hyphens:none;hyphens:none
}
.sec-texto{text-wrap:pretty}

/* Display grande pede entreletra negativa; caixa alta pequena pede positiva. */
.nomes{letter-spacing:-.018em}
.sec-titulo{letter-spacing:-.008em}

/* Filete com losango ao centro, não dois pontos. */
.rule{
  width:96px;height:7px;margin:1.7rem auto;position:relative;background:none;
  opacity:.68
}
.rule::before{
  content:'';position:absolute;inset:50% auto auto 0;width:38px;height:1px;
  background:var(--accent);transform:translateY(-50%);border-radius:0
}
.rule::after{
  content:'';position:absolute;top:50%;left:50%;width:5px;height:5px;
  background:var(--accent);border-radius:0;
  transform:translate(-50%,-50%) rotate(45deg)
}
.rule .fim{
  position:absolute;top:50%;right:0;width:38px;height:1px;
  background:var(--accent);transform:translateY(-50%)
}
.faixa-invertida .rule::before,.faixa-invertida .rule::after,
.faixa-invertida .rule .fim{background:var(--accent-2)}

/* Monograma com leve letterpress: afundado no papel, não impresso em cima. */
.mono-grande{
  text-shadow:
    0 1px 0 color-mix(in srgb,var(--emboss-hi) 60%,transparent),
    0 -1px 1px color-mix(in srgb,var(--emboss-lo) 40%,transparent)
}
.com-midia .mono-grande{text-shadow:0 2px 24px color-mix(in srgb,var(--paper-2) 70%,transparent)}

/* Sobretítulo de papelaria. Convenção do gênero: o rótulo pequeno em
   caixa alta acima do título. Usado com parcimônia, não em toda seção. */
.sobretitulo{
  font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 1rem;font-weight:400
}

/* Pais dos noivos. No convite brasileiro é quase obrigatório.
   Em tela estreita duas colunas quebram o nome no meio, então a régua
   vira horizontal e os blocos empilham. */
.pais{
  display:grid;gap:1.8rem;max-width:430px;margin:2.6rem auto 0;
  text-align:center
}
.pais > div + div{
  padding-top:1.8rem;
  border-top:1px solid color-mix(in srgb,var(--accent) 28%,transparent)
}
@media (min-width:430px){
  .pais{grid-template-columns:1fr 1px 1fr;gap:1.6rem;align-items:start}
  .pais::before{
    content:'';grid-column:2;grid-row:1;width:1px;height:100%;
    background:color-mix(in srgb,var(--accent) 28%,transparent)
  }
  .pais > div:first-of-type{grid-column:1;grid-row:1}
  .pais > div:last-of-type{grid-column:3;grid-row:1}
  .pais > div + div{padding-top:0;border-top:0}
}
.pais-rot{
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 .55rem;opacity:.85
}
.pais-nome{
  font-family:var(--f-display),serif;font-size:1.02rem;line-height:1.7;
  color:var(--ink);margin:0;text-wrap:balance
}

/* Carta com borda de papel artesanal. */
.carta{
  border:0;
  -webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22560%22%3E%3Cfilter%20id%3D%22d%22%20x%3D%22-6%25%22%20y%3D%22-6%25%22%20width%3D%22112%25%22%20height%3D%22112%25%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.028%22%20numOctaves%3D%224%22%20seed%3D%227%22%20result%3D%22n%22%2F%3E%3CfeDisplacementMap%20in%3D%22SourceGraphic%22%20in2%3D%22n%22%20scale%3D%229%22%20xChannelSelector%3D%22R%22%20yChannelSelector%3D%22G%22%2F%3E%3C%2Ffilter%3E%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%22380%22%20height%3D%22540%22%20fill%3D%22%23fff%22%20filter%3D%22url%28%23d%29%22%2F%3E%3C%2Fsvg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22560%22%3E%3Cfilter%20id%3D%22d%22%20x%3D%22-6%25%22%20y%3D%22-6%25%22%20width%3D%22112%25%22%20height%3D%22112%25%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.028%22%20numOctaves%3D%224%22%20seed%3D%227%22%20result%3D%22n%22%2F%3E%3CfeDisplacementMap%20in%3D%22SourceGraphic%22%20in2%3D%22n%22%20scale%3D%229%22%20xChannelSelector%3D%22R%22%20yChannelSelector%3D%22G%22%2F%3E%3C%2Ffilter%3E%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%22380%22%20height%3D%22540%22%20fill%3D%22%23fff%22%20filter%3D%22url%28%23d%29%22%2F%3E%3C%2Fsvg%3E");
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat
}
.carta .script{letter-spacing:-.01em}

/* Coroa de louros em volta do monograma, como no lacre de papelaria fina. */
.coroa{
  display:block;width:132px;height:132px;margin:0 auto 1.3rem;
  color:var(--accent);opacity:.9;position:relative
}
.coroa svg{width:100%;height:100%;display:block;fill:currentColor}
.coroa .mono{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-display),serif;font-size:1.5rem;letter-spacing:.05em;
  color:var(--accent)
}

/* Com os pais acima, o título precisa de respiro e de um filete separando. */
.sec-titulo.apos-pais{margin-top:2.4rem}
.sec-titulo.apos-pais::before{
  content:'';display:block;width:54px;height:1px;margin:0 auto 2rem;
  background:color-mix(in srgb,var(--accent) 35%,transparent)
}

/* =============================================================
   ENVELOPE EM FOTO
   Quando existe arte de verdade do envelope, ela entra no lugar do
   envelope em CSS. Foto boa e vetor desenhado brigando na mesma tela
   é pior que qualquer um dos dois sozinho.
   ============================================================= */
#cena.foto{background:#0b0b0c;perspective:none}
.foto-env{position:absolute;inset:0;z-index:1;overflow:hidden}
.foto-env img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.01);
  transition:transform 1.5s var(--ease-out),opacity 1.1s var(--ease-out) .25s
}
#cena.foto.abrindo .foto-env img{transform:scale(1.16);opacity:0}
.foto-toque{
  position:absolute;inset:0;z-index:3;cursor:pointer;
  display:grid;align-content:end;justify-items:center;
  padding-bottom:max(7vh,calc(env(safe-area-inset-bottom) + 2rem));
  background:linear-gradient(180deg,transparent 52%,rgba(0,0,0,.58) 100%);
  -webkit-tap-highlight-color:transparent;
  transition:opacity .5s var(--ease-out)
}
.foto-toque p{
  margin:0;color:#fff;font-size:.76rem;letter-spacing:.3em;
  text-transform:uppercase;
  padding:.6rem 1.3rem;border-radius:999px;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(0,0,0,.3);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  text-shadow:0 1px 8px rgba(0,0,0,.7);
  animation:respira 2.6s var(--ease-in-out) infinite
}
#cena.foto.abrindo .foto-toque{opacity:0;pointer-events:none}

/* Programação do dia: hora à esquerda numa coluna fixa, momento à direita,
   sobre uma régua. Números tabulares para as horas alinharem. */
.prog{
  list-style:none;margin:2.2rem auto 0;padding:0;max-width:340px;text-align:left;
  border-left:1px solid color-mix(in srgb,var(--accent) 32%,transparent)
}
.prog li{
  position:relative;display:grid;grid-template-columns:4.2rem 1fr;
  gap:.9rem;align-items:baseline;padding:0 0 1.5rem 1.4rem
}
.prog li:last-child{padding-bottom:0}
.prog li::before{
  content:'';position:absolute;left:-3.5px;top:.5rem;
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px var(--paper)
}
.faixa-escura .prog li::before{box-shadow:0 0 0 4px var(--paper-2)}
.prog .hr{
  font-family:var(--f-display),serif;font-size:1.05rem;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.02em
}

      '<div class="luz"></div>' + carta +
      '<div class="aba aba-e"></div><div class="aba aba-d"></div>' +
      '<div class="aba aba-b"></div><div class="aba aba-t"></div>';

  var temFoto = tem(C.envelopeImagem) && !tem(C.cortinaVideo);
  var temCortina = tem(C.cortinaVideo);
  var cena = temFoto
    ? '<div id="cena" class="foto">' +
        '<div class="foto-env"><img src="' + esc(C.envelopeImagem) + '" alt="Envelope do convite"></div>' +
        '<div class="foto-toque" id="env" role="button" tabindex="0" aria-label="Abrir convite">' +
          '<p>' + esc(C.textoAbrir || 'Toque para abrir') + '</p>' +
        '</div>' +
      '</div>'
    : temCortina
    ? '<div id="cena" class="cortina">' +
        '<div class="cortina-midia">' +
          '<video id="cortina" playsinline preload="auto" ' +
            (tem(C.cortinaPoster) ? 'poster="' + esc(C.cortinaPoster) + '" ' : '') +
            'src="' + esc(C.cortinaVideo) + '"></video>' +
        '</div>' +
        '<div class="cortina-toque" id="env" role="button" tabindex="0" aria-label="Abrir convite">' +
          '<p>' + esc(C.textoAbrir || 'Toque para abrir') + '</p>' +
        '</div>' +
      '</div>'
    : '<div id="cena">' +
      '<div class="env' + (ehPeel ? ' peel' : '') + '" id="env" role="button" tabindex="0" aria-label="Abrir convite">' +
        '<div class="env-corpo"></div>' + dentro +
        '<div class="lacre"><div class="lacre-disco"><span class="lacre-mono">' + mono + '</span></div></div>' +
      '</div>' +
      '<p class="toque">' + esc(C.textoAbrir || 'Toque para abrir') + '</p>' +
    '</div>';

  /* =============================================================
     Seções. Cada família de layout aparece uma vez —
     oito blocos de texto centralizado é um template, não um convite.
     ============================================================= */
  var S = [];

  // capa — centralizada se justifica: a mensagem é o design
  S.push(
    '<header class="capa-hero' + (tem(C.heroMidia) ? ' com-midia' : '') + '">' +
      camadaMidia(C.heroMidia, C.heroVeu) +
      '<div class="moldura"></div>' +
      '<div class="coroa">' + COROA + '<span class="mono">' + mono + '</span></div>' +
      (tem(C.versiculo) ? '<p class="versiculo">' + esc(C.versiculo) + '</p>' : '') +
      '<h1 class="nomes script">' + esc(C.noiva) + '<span class="e-comercial">&amp;</span>' + esc(C.noivo) + '</h1>' +
      '<div class="rule"><i class="fim"></i></div>' +
      '<p class="data-capa">' + esc(dataCurta) + '</p>' +
      '<div class="seta"></div>' +
    '</header>'
  );

  // convite
  var temPais = tem(C.paisNoiva) || tem(C.paisNoivo);
  S.push(
    '<section class="centro faixa-clara">' +
      (tem(C.sobretitulo) ? '<p class="sobretitulo">' + esc(C.sobretitulo) + '</p>' : '') +
      (temPais
        ? '<div class="pais">' +
            (tem(C.paisNoiva) ? '<div><p class="pais-rot">' + esc(C.rotuloPaisNoiva || 'Pais da noiva') + '</p>' +
              '<p class="pais-nome">' + linhas(C.paisNoiva) + '</p></div>' : '') +
            (tem(C.paisNoivo) ? '<div><p class="pais-rot">' + esc(C.rotuloPaisNoivo || 'Pais do noivo') + '</p>' +
              '<p class="pais-nome">' + linhas(C.paisNoivo) + '</p></div>' : '') +
          '</div>' : '') +
      '<h2 class="sec-titulo' + (temPais ? ' apos-pais' : '') + '">' + esc(C.tituloConvite || 'Com alegria, convidamos você') + '</h2>' +
      '<div class="rule"><i class="fim"></i></div>' +
      par(C.textoConvite) +
    '</section>'
  );

  // contagem — régua horizontal, números tabulares
  if (dt) {
    S.push(
      '<section class="centro faixa-escura">' +
        '<h2 class="sec-titulo data">' + esc(diaSemana) + '<br>' + esc(dataExtenso) + '</h2>' +
        '<div class="contagem" id="contagem">' +
          '<div class="cx"><b data-c="d">--</b><span>Dias</span></div>' +
          '<div class="cx"><b data-c="h">--</b><span>Horas</span></div>' +
          '<div class="cx"><b data-c="m">--</b><span>Min</span></div>' +
          '<div class="cx"><b data-c="s">--</b><span>Seg</span></div>' +
        '</div>' +
      '</section>'
    );
  }

  // história — assimétrica, foto sangrando na borda
  if (tem(C.historia)) {
    S.push(
      '<section class="faixa-clara">' +
        '<div class="historia">' +
          (tem(C.fotoHistoria)
            ? '<img class="foto" src="' + esc(C.fotoHistoria) + '" alt="' + esc(C.noiva) + ' e ' + esc(C.noivo) + '">' : '') +
          '<div class="texto">' +
            '<h2 class="sec-titulo">' + esc(C.tituloHistoria || 'Como tudo começou') + '</h2>' +
            par(C.historia) +
          '</div>' +
        '</div>' +
      '</section>'
    );
  }

  // eventos — linha do tempo numa régua, não cards
  var itens = '';
  if (tem(C.localCerimonia)) {
    itens +=
      '<li>' + ico('igreja') +
        '<p class="hora">' + esc(C.horaCerimonia || '') + '</p>' +
        '<h3>Cerimônia</h3>' +
        '<p><strong>' + esc(C.localCerimonia) + '</strong></p>' +
        (tem(C.enderecoCerimonia) ? '<p>' + esc(C.enderecoCerimonia) + '</p>' : '') +
        (tem(C.mapaCerimonia) ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(C.mapaCerimonia) + '">Como chegar</a>' : '') +
      '</li>';
  }
  if (tem(C.localFesta)) {
    itens +=
      '<li>' + ico('taca') +
        '<p class="hora">' + esc(C.horaFesta || '') + '</p>' +
        '<h3>Recepção</h3>' +
        '<p><strong>' + esc(C.localFesta) + '</strong></p>' +
        (tem(C.enderecoFesta) ? '<p>' + esc(C.enderecoFesta) + '</p>' : '') +
        (tem(C.mapaFesta) ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(C.mapaFesta) + '">Como chegar</a>' : '') +
      '</li>';
  }
  if (itens) {
    S.push(
      '<section class="faixa-escura">' +
        '<h2 class="sec-titulo">O grande dia</h2>' +
        '<ul class="linha seq">' + itens + '</ul>' +
      '</section>'
    );
  }


  // Programação do dia. Dois concorrentes têm, e eu só tinha cerimônia
  // e festa. Uma linha por momento: "19:00 | Cerimônia".
  if (tem(C.programacao)) {
    var linhasProg = String(C.programacao).split(/\n+/)
      .map(function (l) { return l.trim(); }).filter(Boolean)
      .map(function (l) {
        var m = l.split('|');
        var hora = (m[0] || '').trim();
        var oque = (m.slice(1).join('|') || '').trim();
        return '<li><span class="hr">' + esc(hora) + '</span>' +
               '<span class="oq">' + esc(oque) + '</span></li>';
      }).join('');
    S.push(
      '<section class="centro faixa-clara">' +
        '<h2 class="sec-titulo">' + esc(C.tituloProgramacao || 'Programação do dia') + '</h2>' +
        '<div class="rule"><i class="fim"></i></div>' +
        '<ol class="prog seq">' + linhasProg + '</ol>' +
      '</section>'
    );
  }

  // traje — uma linha só
  if (tem(C.dressCode)) {
    S.push(
      '<section class="centro faixa-clara traje">' +
        '<p class="valor">' + esc(C.dressCode) + '</p>' +
        '<div class="rule"><i class="fim"></i></div>' +
        (tem(C.dressCodeObs) ? '<p class="sec-texto">' + esc(C.dressCodeObs) + '</p>' : '') +
      '</section>'
    );
  }

  // galeria — grade assimétrica
  if (C.galeria && C.galeria.length) {
    S.push(
      '<section class="centro faixa-escura">' +
        '<h2 class="sec-titulo">Nós dois</h2>' +
        '<div class="galeria seq">' +
          C.galeria.map(function (src, i) {
            return '<img style="--i:' + i + '" src="' + esc(src) + '" alt="' + esc(C.noiva) + ' e ' + esc(C.noivo) + ', foto ' + (i + 1) + '" loading="lazy">';
          }).join('') +
        '</div>' +
      '</section>'
    );
  }

  // RSVP — faixa invertida: o maior contraste da página fica na única ação
  if (tem(C.whatsapp)) {
    var zap = String(C.whatsapp).replace(/\D/g, '');
    var msg = encodeURIComponent(C.msgRsvp || ('Olá! Confirmo minha presença no casamento de ' + C.noiva + ' e ' + C.noivo));
    S.push(
      '<section class="faixa-invertida">' +
        '<h2 class="sec-titulo">Você vem?</h2>' +
        '<div class="rule"><i class="fim"></i></div>' +
        par(C.textoRsvp) +
        '<a class="btn cheio btn-bloco" target="_blank" rel="noopener" href="https://wa.me/' + esc(zap) + '?text=' + msg + '">Confirmar presença</a>' +
      '</section>'
    );
  }

  // presentes
  if (tem(C.pixChave) || tem(C.listaPresentes)) {
    S.push(
      '<section class="centro faixa-clara">' +
        '<h2 class="sec-titulo">' + esc(C.tituloPresentes || 'Se quiser nos presentear') + '</h2>' +
        '<div class="rule"><i class="fim"></i></div>' +
        par(C.textoPresentes) +
        (tem(C.listaPresentes) ? '<a class="btn btn-bloco" target="_blank" rel="noopener" href="' + esc(C.listaPresentes) + '">Ver lista de presentes</a>' : '') +
        (tem(C.pixChave)
          ? '<div class="pix">' +
              '<p class="rotulo">Chave PIX' + (tem(C.pixNome) ? ' · ' + esc(C.pixNome) : '') + '</p>' +
              '<code id="pix">' + esc(C.pixChave) + '</code>' +
              '<button class="btn" id="copiaPix" type="button">Copiar chave</button>' +
            '</div>' : '') +
      '</section>'
    );
  }

  // recado
  if (tem(C.recado)) {
    S.push(
      '<section class="centro faixa-escura">' +
        '<h2 class="sec-titulo">' + esc(C.tituloRecado || 'Um recado') + '</h2>' +
        '<div class="rule"><i class="fim"></i></div>' + par(C.recado) +
      '</section>'
    );
  }

  S.push(
    '<footer>' +
      '<p class="mono-grande">' + mono + '</p>' +
      '<p class="nomes-fim">' + esc(C.noiva) + ' &amp; ' + esc(C.noivo) + '</p>' +
      '<p class="data-fim">' + esc(dataExtenso) + '</p>' +
      (tem(C.cidade) ? '<p class="cidade-fim">' + esc(C.cidade) + '</p>' : '') +
      '<p class="assinatura">' +
        (tem(C.marcaUrl)
          ? '<a href="' + esc(C.marcaUrl) + '" target="_blank" rel="noopener">' + esc(C.marca || '') + '</a>'
          : esc(C.marca || '')) +
      '</p>' +
    '</footer>'
  );

  var audioHtml = tem(C.musica)
    ? '<audio id="audio" loop preload="none" src="' + esc(C.musica) + '"></audio>' +
      '<button class="som" id="som" type="button" title="' + esc(C.musicaTitulo || 'Música') + '" ' +
        'aria-label="Desligar a música' + (tem(C.musicaTitulo) ? ': ' + esc(C.musicaTitulo) : '') + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICO.som + '</svg></button>'
    : '';

  if (tem(C.textura)) {
    root.style.setProperty('--textura', 'url("' + C.textura + '")');
    document.body.classList.add('tem-textura');
  }

  document.body.innerHTML =
    cena + '<canvas id="petalas" aria-hidden="true"></canvas>' +
    '<main class="wrap">' + S.join('') + '</main>' + audioHtml;

  /* =============================================================
     Comportamento
     ============================================================= */
  document.body.classList.add('locked');
  var env = document.getElementById('env');
  var cenaEl = document.getElementById('cena');
  var audio = document.getElementById('audio');
  var btnSom = document.getElementById('som');
  var abriu = false;

  /* A abertura é encenada em etapas. Tudo junto não se vê.
     Duração longa se justifica: é um momento único, visto uma vez. */
  function abrir() {
    if (abriu) return;
    abriu = true;

    // o toque É o gesto do usuário — é aqui, e só aqui, que o áudio libera
    if (audio) {
      // Sobe o volume aos poucos: entrar com som cheio num lugar público
      // faz o convidado fechar antes de ler.
      var alvoVol = Math.min(1, Math.max(0, (parseFloat(C.musicaVolume) || 32) / 100));
      audio.volume = 0;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
      var sobe = setInterval(function () {
        if (audio.volume < alvoVol - 0.01) audio.volume = Math.min(alvoVol, audio.volume + alvoVol / 16);
        else { audio.volume = alvoVol; clearInterval(sobe); }
      }, 120);
      if (btnSom) btnSom.classList.add('vis');
    }

    if (temFoto) {
      cenaEl.classList.add('abrindo');
      setTimeout(revelar, 1350);
      return;
    }

    if (temCortina) {
      // A cortina é um vídeo: ele mesmo é a animação de abertura.
      // Revela quando o vídeo acaba — com teto de tempo, porque um
      // vídeo que não carrega não pode prender o convidado na tela.
      cenaEl.classList.add('tocou');
      var vid = document.getElementById('cortina');
      var revelou = false;
      var revela = function () { if (!revelou) { revelou = true; revelar(); } };
      vid.addEventListener('ended', revela);
      vid.addEventListener('error', revela);
      var pv = vid.play();
      if (pv && pv.catch) pv.catch(revela);
      setTimeout(revela, 14000);
      return;
    }

    [[0, 'selo-sai'], [420, 'abrindo'], [1220, 'carta-sai'], [2250, 'indo']]
      .forEach(function (p) { setTimeout(function () { env.classList.add(p[1]); }, p[0]); });
    setTimeout(revelar, 2750);
  }

  function revelar() {
    cenaEl.classList.add('foi');
    document.body.classList.remove('locked');
    window.scrollTo(0, 0);
    var pet = document.getElementById('petalas');
    if (pet) pet.classList.add('on');
  }

  env.addEventListener('click', abrir);
  env.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); }
  });

  if (btnSom && audio) {
    btnSom.addEventListener('click', function () {
      var mudo = !audio.paused;
      if (mudo) { audio.pause(); } else { audio.play(); }
      btnSom.classList.toggle('off', mudo);
      btnSom.setAttribute('aria-label', mudo ? 'Ligar a música' : 'Desligar a música');
      btnSom.querySelector('svg').innerHTML = mudo ? ICO.mudo : ICO.som;
    });
  }

  /* revelação em sequência — só onde a ordem significa algo */
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      [].forEach.call(e.target.children, function (el, i) { el.style.setProperty('--i', i); });
      e.target.classList.add('on');
      io.unobserve(e.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -6% 0px' });
  document.querySelectorAll('.seq').forEach(function (el) { io.observe(el); });

  /* contagem regressiva */
  if (dt) {
    var alvo = dt.getTime();
    var campos = {};
    document.querySelectorAll('#contagem [data-c]').forEach(function (el) { campos[el.dataset.c] = el; });
    (function tick() {
      var seg = Math.floor(Math.max(0, alvo - Date.now()) / 1000);
      var o = { d: Math.floor(seg / 86400), h: Math.floor(seg % 86400 / 3600),
                m: Math.floor(seg % 3600 / 60), s: seg % 60 };
      Object.keys(campos).forEach(function (k) {
        campos[k].textContent = String(o[k]).padStart(2, '0');
      });
      setTimeout(tick, 1000);
    })();
  }

  /* copiar PIX */
  var bp = document.getElementById('copiaPix');
  if (bp) {
    bp.addEventListener('click', function () {
      var txt = document.getElementById('pix').textContent;
      var ok = function () {
        bp.textContent = 'Copiado';
        setTimeout(function () { bp.textContent = 'Copiar chave'; }, 2200);
      };
      if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(ok, ok); }
      else {
        var t = document.createElement('textarea');
        t.value = txt; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(t); ok();
      }
    });
  }

  /* pétalas */
  (function () {
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    var cv = document.getElementById('petalas');
    if (!cv) return;
    var cx = cv.getContext('2d'), w, h, ps = [];
    var cor = getComputedStyle(root).getPropertyValue('--accent-2').trim() || '#ddc79a';
    function dim() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
    dim(); addEventListener('resize', dim);
    for (var i = 0; i < 14; i++) {
      ps.push({ x: Math.random() * w, y: Math.random() * h, r: 3 + Math.random() * 4.5,
                vy: .2 + Math.random() * .45, vx: -.22 + Math.random() * .44,
                a: Math.random() * 6.28, va: -.013 + Math.random() * .026,
                o: .14 + Math.random() * .24 });
    }
    (function loop() {
      cx.clearRect(0, 0, w, h);
      ps.forEach(function (p) {
        p.y += p.vy; p.x += p.vx + Math.sin(p.y / 80) * .3; p.a += p.va;
        if (p.y > h + 20) { p.y = -20; p.x = Math.random() * w; }
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
        cx.globalAlpha = p.o; cx.fillStyle = cor;
        cx.beginPath(); cx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.2832); cx.fill();
        cx.restore();
      });
      requestAnimationFrame(loop);
    })();
  })();
})();
</script></body></html>
